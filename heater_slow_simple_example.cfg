# heater_slow_simple_example.cfg
#
# Example configuration for the heater_slow Klipper extra.
#
# Copy heater_slow.py into klippy/extras/ and restart Klipper, then
# use [heater_slow <name>] instead of [heater_generic <name>].
#
# All standard Klipper heater options work unchanged.
# The only custom option added by this extra is max_duration (optional).

[heater_slow my_dryer]
heater_pin: PB1
sensor_type: AHT20
sensor_pin: PA0
min_temp: 0
max_temp: 70
control: pid
pid_kp: 12.0
pid_ki: 0.5
pid_kd: 45.0
# max_duration is optional; default is 10.0 seconds
# Increase if your sensor reports less frequently than the default watchdog window.
# max_duration: 10.0
